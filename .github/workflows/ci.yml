name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.21"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/qualipilot

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.21"
          enable-cache: true
      - run: >-
          uv sync --locked
          --extra bedrock
          --extra dask
          --extra gz
          --extra linking
          --extra duckdb
          --extra ner
          --extra ollama
          --extra openai
      - run: uv run pytest -q
      - name: upload coverage
        if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage.xml

  config:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.21"
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.15.8"
      - run: uv sync --locked
      - run: >-
          uv export --locked --no-dev --no-emit-project
          --extra bedrock --extra dask --extra gz --extra linking --extra duckdb
          --extra ner
          --extra ollama --extra openai --extra spark
          --output-file "$RUNNER_TEMP/requirements-audit.txt"
      - run: >-
          uv run pip-audit --requirement "$RUNNER_TEMP/requirements-audit.txt"
          --no-deps --disable-pip
      - run: shellcheck install.sh
      - name: parse PowerShell installer
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path install.ps1),
            [ref] $tokens,
            [ref] $errors
          ) | Out-Null
          if ($errors) {
            $errors | Format-List
            exit 1
          }
      - run: docker compose -f docker/docker-compose.yml config --quiet
      - run: terraform -chdir=deploy/terraform fmt -check -recursive
      - run: terraform -chdir=deploy/terraform init -backend=false -lockfile=readonly
      - run: terraform -chdir=deploy/terraform validate
      - run: terraform -chdir=deploy/terraform test

  minimums:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.21"
      - run: uv venv
      - run: >-
          uv pip install --resolution lowest-direct
          ".[bedrock,dask,gz,linking,duckdb,ner,ollama,openai]"
          "pytest>=8.3,<10"
          "pytest-cov>=5.0,<8"
          "hypothesis>=6.112,<7"
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync qualipilot --help

  spark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pyspark: ["3.5.6", "4.2.0"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.21"
      - run: uv sync --locked --extra spark
      - run: uv pip install --python .venv/bin/python "pyspark==${{ matrix.pyspark }}"
      - run: java -version
      - run: uv run --no-sync pytest -q tests/test_spark_engine.py --no-cov

  build:
    needs: [lint, test, config, minimums, spark]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.21"
      - run: uv sync --locked
      - run: uv build --clear
      - run: uv run twine check dist/*
      - name: smoke-test wheel
        run: |
          uv venv "$RUNNER_TEMP/wheel-smoke"
          uv pip install --python "$RUNNER_TEMP/wheel-smoke/bin/python" dist/*.whl
          "$RUNNER_TEMP/wheel-smoke/bin/qualipilot" --version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  docker:
    needs: [lint, test, config]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: build runtime image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: qualipilot:ci
      - run: docker run --rm qualipilot:ci --version
      - name: scan runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: qualipilot:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: build lambda image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile.lambda
          load: true
          tags: qualipilot-lambda:ci
      - name: smoke-test lambda imports
        run: >-
          docker run --rm
          --entrypoint /var/lang/bin/python3.12
          qualipilot-lambda:ci
          -c "import qualipilot.lambda_handler"
      - name: scan lambda image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: qualipilot-lambda:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

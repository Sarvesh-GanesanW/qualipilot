name: release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.21"
      - name: verify release source and version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(python -c \
            'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$tag_version" = "$package_version"
          grep -F "## [$tag_version]" CHANGELOG.md
          git fetch origin main
          tag_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          git merge-base --is-ancestor "$tag_commit" origin/main
      - name: require successful full CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          test "$(gh run list --commit "$GITHUB_SHA" --workflow ci.yml
          --json conclusion --jq
          'any(.[]; .conclusion == "success")')" = "true"
      - run: >-
          uv sync --locked
          --extra bedrock
          --extra dask
          --extra gz
          --extra linking
          --extra duckdb
          --extra ner
          --extra ollama
          --extra openai
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/qualipilot
      - run: uv run pytest -q
      - run: uv build --clear
      - run: uv run twine check dist/*
      - name: smoke-test release wheel
        run: |
          uv venv "$RUNNER_TEMP/wheel-smoke"
          uv pip install --python "$RUNNER_TEMP/wheel-smoke/bin/python" dist/*.whl
          test "$("$RUNNER_TEMP/wheel-smoke/bin/qualipilot" --version)" = \
            "qualipilot ${GITHUB_REF_NAME#v}"
      - name: smoke-test release sdist
        run: |
          uv venv "$RUNNER_TEMP/sdist-smoke"
          uv pip install --python "$RUNNER_TEMP/sdist-smoke/bin/python" dist/*.tar.gz
          test "$("$RUNNER_TEMP/sdist-smoke/bin/qualipilot" --version)" = \
            "qualipilot ${GITHUB_REF_NAME#v}"
      - name: upload release distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      actions: read
      id-token: write
    steps:
      - name: download release distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-dist
          path: dist/
      - name: publish to pypi (trusted publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

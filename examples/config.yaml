# full qualipilot config for the sample dataset.
# run with:
#     qualipilot check examples/sample.csv --config examples/config.yaml

engine: polars
report_format: json

checks:
  missing_values: true
  duplicates: true
  data_types: true
  outliers: true
  ranges: true
  cardinality: true
  freshness: true
  outlier_iqr_multiplier: 1.5
  sample_size: 5
  duplicate_subset: [order_id]
  column_ranges:
    amount:
      min: 0
      max: 100000
  freshness_columns: [created_at]
  freshness_max_age_hours: 24

llm:
  provider: none
  # To enable Bedrock, copy this file and supply a model available in
  # your account and region:
  # provider: bedrock
  # model: your-bedrock-model-id
  # region: us-east-1
  # aws_profile: sre-tea
  temperature: 0.2
  max_tokens: 1200

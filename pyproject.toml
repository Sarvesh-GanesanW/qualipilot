[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "qualipilot"
version = "3.4.0"
description = "Data quality, record linkage, and named-entity extraction."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
authors = [
    { name = "Sarvesh Ganesan", email = "sarveshganesan99@gmail.com" },
]
keywords = [
    "data-quality",
    "data-validation",
    "named-entity-recognition",
    "record-linkage",
    "bedrock",
    "ollama",
    "polars",
    "pandas",
    "dask",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "polars>=1.20,<2",
    "pandas>=2.2,<3",
    "numpy>=2.0,<2.5",
    "pyarrow>=17.0,<26",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "typer>=0.15.4,<1",
    "rich>=13.8,<16",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
bedrock = ["boto3>=1.35,<2", "botocore>=1.35,<2"]
dask = ["dask[dataframe]>=2024.8,<2027"]
ollama = ["httpx>=0.27,<1", "tenacity>=9.0,<10"]
openai = ["httpx>=0.27,<1", "tenacity>=9.0,<10"]
linking = ["rapidfuzz>=3.9,<4"]
duckdb = ["duckdb>=1.5.1,<2"]
ner = ["spacy>=3.8.7,<4"]
gz = [
    "boto3>=1.35,<2",
    "botocore>=1.35,<2",
    "httpx>=0.27,<1",
    "tenacity>=9.0,<10",
]
spark = ["pyspark>=3.5.6,<4.3", "pandas>=2.2,<3"]
all = [
    "boto3>=1.35,<2",
    "botocore>=1.35,<2",
    "dask[dataframe]>=2024.8,<2027",
    "rapidfuzz>=3.9,<4",
    "duckdb>=1.5.1,<2",
    "pyspark>=3.5.6,<4.3",
    "pandas>=2.2,<3",
    "httpx>=0.27,<1",
    "tenacity>=9.0,<10",
    "spacy>=3.8.7,<4",
]

[dependency-groups]
dev = [
    "uv==0.12.7",
    "ruff==0.16.0",
    "mypy==2.3.0",
    "pytest>=8.3,<10",
    "pytest-cov>=5.0,<8",
    "hypothesis>=6.112,<7",
    "pip-audit>=2.9,<3",
    "pre-commit>=3.8,<5",
    "twine>=6,<7",
    "types-PyYAML",
    "httpx>=0.27,<1",
    "tenacity>=9.0,<10",
    # mypy targets Python 3.11; NumPy 2.5 stubs require PEP 695 syntax.
    "numpy>=2,<2.5",
]

[project.urls]
Homepage = "https://github.com/Sarvesh-GanesanW/qualipilot"
Repository = "https://github.com/Sarvesh-GanesanW/qualipilot"
Issues = "https://github.com/Sarvesh-GanesanW/qualipilot/issues"

[project.scripts]
qualipilot = "qualipilot.cli:_run"

[tool.hatch.build.targets.wheel]
packages = ["src/qualipilot"]

[tool.hatch.build.targets.sdist]
include = [
    "src/qualipilot",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
line-length = 79
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C90",
    "UP",
    "N",
    "SIM",
    "PL",
    "RUF",
    "ASYNC",
    "PT",
    "RET",
    "TID",
]
ignore = [
    "PLR0913",
    "PLR2004",
    "PLC0415",
    "PLR0911",
    "N812",
    # Typer command callbacks naturally expose many CLI parameters.
    "PLR0917",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_any_unimported = false
ignore_missing_imports = true
files = ["src/qualipilot"]

[[tool.mypy.overrides]]
module = ["qualipilot.cli"]
# StrEnum.value narrowness varies between mypy versions; the casts
# guard the older path and look redundant on the newer one. Either way
# the runtime types are correct.
warn_unused_ignores = false
disable_error_code = ["redundant-cast"]

[[tool.mypy.overrides]]
module = ["qualipilot.engines.dask_engine"]
# Dask is optional: these ignores are needed when its typed package is
# installed and look unused when mypy sees only the fallback Any import.
warn_unused_ignores = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=qualipilot",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "-m",
    "not integration",
]
testpaths = ["tests"]
markers = [
    "integration: hits external services (skipped by default)",
    "slow: slow tests",
]

[tool.coverage.run]
branch = true
source = ["qualipilot"]

[tool.coverage.report]
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

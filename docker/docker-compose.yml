services:
  ollama:
    image: ollama/ollama:0.32.4@sha256:10c13eb515db310990527d36ca14a136da4bcc0fbf2bf3b15e9c1f111e9d3cd4
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  model:
    image: ollama/ollama:0.32.4@sha256:10c13eb515db310990527d36ca14a136da4bcc0fbf2bf3b15e9c1f111e9d3cd4
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: "http://ollama:11434"
    volumes:
      - ollama-models:/root/.ollama
    entrypoint: ["ollama"]
    command: ["pull", "qwen3:4b"]
    restart: "no"

  qualipilot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        EXTRAS: "ollama"
    image: qualipilot:dev
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    depends_on:
      model:
        condition: service_completed_successfully
    environment:
      QUALIPILOT_JSON_LOGS: "1"
    volumes:
      - ../examples:/data:ro
      - ../reports:/reports
    command:
      - "check"
      - "/data/sample.csv"
      - "--engine"
      - "polars"
      - "--output"
      - "/reports/report.html"
      - "--llm"
      - "ollama"
      - "--base-url"
      - "http://ollama:11434"
      - "--allow-insecure-http"
      - "--model"
      - "qwen3:4b"

volumes:
  ollama-models:
